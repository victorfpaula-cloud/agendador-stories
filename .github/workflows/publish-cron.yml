# Alternativa ao pg_cron (use uma OU outra, não as duas).
# O agendamento automático (schedule) foi DESATIVADO de propósito: o pg_cron
# já é o agendador em produção, e os dois rodando juntos causaram publicação
# duplicada (o mesmo Story postado várias vezes). Deixado só pra rodar manualmente
# (workflow_dispatch), caso precise testar a rota sem esperar o pg_cron disparar.
# Configure em Settings > Secrets and variables > Actions deste repositório:
#   SITE_URL   = https://seu-dominio.vercel.app
#   CRON_SECRET = o mesmo valor da variável de ambiente CRON_SECRET do projeto

name: Publicar stories agendados

on:
  workflow_dispatch: {}

jobs:
  run-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar rota de publicacao
        run: |
          curl -sS -X POST "${{ secrets.SITE_URL }}/api/cron/run" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 60 --fail
